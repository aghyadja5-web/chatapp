<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#229ED9"><link rel="manifest" href="/manifest.json"><title>ChatApp</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="center"><div class="card"><h1>ChatApp</h1><p>Messenger online</p><input id="name" placeholder="Nama"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="register()">Daftar</button><button class="ghost" onclick="login()">Masuk</button><small id="err"></small></div></div>
<div id="app" class="app hidden"><aside><header><b>ChatApp</b><button onclick="logout()">Keluar</button></header><input id="search" placeholder="Cari user..." oninput="users()"><div id="users"></div></aside><main><header><b id="title">Pilih chat</b></header><div id="msgs"></div><footer><input id="text" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></footer></main></div>
<script src="/app.js"></script></body></html>
